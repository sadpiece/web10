<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Каталог товарів </title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js"></script>
</head>
<body>
    <div class="header">
        <h1>Магазин товарів </h1>
    </div>

    <div class="layout">
        <div class="sidebar">
            <div class="categories-box">
                <h2>Категорії</h2>
                <div id="categories-list" class="categories-list">
                    Завантаження категорій...
                </div>
            </div>

            <button id="see-all-btn" class="see-all-btn" onclick="fetchProducts()">
                See all products
            </button>
        </div>

        <div class="content">
            <h2 id="section-title">Усі товари</h2>
            <div id="products-list" class="products-grid">
                Завантаження товарів...
            </div>
        </div>
    </main>

</body>
</html>
