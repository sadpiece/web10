<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог товарів</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>Магазин товарів</h1>
    </div>

    <div class="layout">
        <div class="sidebar">
            <div class="cat-box">
                <h2>Категорії</h2>
                <div id="categories-list">
                    Завантаження категорій...
                </div>
            </div>

            <button id="see-all-btn" class="all-btn" onclick="fetchProducts()">
                See all products
            </button>
        </div>

        <div class="content">
            <h2 id="section-title">Усі товари</h2>
            <div id="products-list" class="products-box">
                Завантаження товарів...
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
